name: ci

on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Anexo J -db layout
        run: |
          test -f 01_ddl/V001__create_spaces_and_blocks.sql
          test -f 02_dml/V002__seed_corte2_catalog.sql
          test -f 03_dcl/V003__table_grants_space_app.sql
          test -f 05_rollbacks/U001__drop_spaces_and_blocks.sql
          test -f deploy/compose.yml
          ! grep -E "image: postgres" deploy/compose.yml
          grep -q "space.spaces" 01_ddl/V001__create_spaces_and_blocks.sql
